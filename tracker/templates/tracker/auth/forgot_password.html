<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HabitGrow</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'tracker/styles.css' %}">
</head>
<body class="auth-body">
    <div class="auth-container animate-fade-in">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <div class="auth-brand">
                    <i class="fa-solid fa-square-check brand-icon animate-pulse"></i>
                    <h2>HabitGrow</h2>
                </div>
                <h1>Reset Password</h1>
                <p class="subtitle">Enter your email and we'll send instructions to reset your password.</p>
            </div>

            <form method="post" class="custom-form mt-4">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="id_email">Email Address</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" name="email" id="id_email" class="form-control field-with-icon" placeholder="Enter your email address" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-glow mt-4">
                    <i class="fa-solid fa-paper-plane"></i> Send Instructions
                </button>
            </form>

            <div class="auth-footer text-center mt-4">
                <p class="text-muted">Remembered it? <a href="{% url 'login' %}" class="auth-action-link">Return to login</a></p>
            </div>
        </div>
    </div>
    <script src="{% static 'tracker/tracker.js' %}"></script>
</body>
</html>
